version: "1"
kind: miner
id: 2847
slug: arcadian-defi-risk
protocol: generic
name: "Arcadian — DeFi TVL and Yield"
description: >
  Supplies deterministic DeFi measurements for TVL_LOOKUP and CRYPTO_YIELD_RATE.
  TVL is the complete DefiLlama protocol or protocol-chain figure, or an exact
  pool's TVL. Yield is the observed APY of an exact pool or the disclosed
  TVL-weighted top-five pool sample for a named protocol. Each answer includes
  the measured value, units, scope, source URL, retrieval time and cache limit.
  Pool research is available separately; this miner does not claim to audit
  bytecode, detect fraud, or measure executable trading depth.

base_url: https://arcadian-gamma.vercel.app
docs:
  website: https://arcadian-gamma.vercel.app/desk
  repository: https://github.com/greyw0rks/arcadian

limitations:
  - code: PUBLIC_FEED_FRESHNESS
    message: "Public-feed observations may be older than their retrieval time. Pool data is cached up to 60 seconds; protocol metadata up to 300 seconds."
  - code: YIELD_SAMPLE_SCOPE
    message: "Protocol yield uses at most five pools by TVL. The response identifies every sampled pool and the measured scope. This is not a promised return."
  - code: TVL_NOT_TRADE_DEPTH
    message: "TVL is locked value, not executable liquidity or a maximum safe trade size."

auth:
  type: none
rate_limit_per_sec: 10
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30
errors:
  message_path: error

endpoints:
  - path: /measure
    external_path: /api/telegraph/measure
    method: POST
    description: >
      Return a deterministic TVL or yield measurement. Select intent
      TVL_LOOKUP or CRYPTO_YIELD_RATE and name a protocol, exact pool_id, or a
      query naming a protocol. Optional chain scopes the protocol measurement.
      TVL_LOOKUP rejects asset-filtered protocol totals; name a pool_id for
      pool TVL. CRYPTO_YIELD_RATE accepts an optional asset filter.
    content_type: application/json
    intents: [TVL_LOOKUP, CRYPTO_YIELD_RATE]
    params:
      body:
        required:
          - name: intent
            type: string
            intents: ["*"]
            description: "Choose the measurement matching the requested Intent."
            accepted_fields:
              - value: TVL_LOOKUP
                intents: [TVL_LOOKUP]
                description: "Complete protocol or protocol-chain TVL in USD, or exact pool TVL."
              - value: CRYPTO_YIELD_RATE
                intents: [CRYPTO_YIELD_RATE]
                description: "Observed APY for an exact pool or a disclosed protocol pool sample."
        optional:
          - name: query
            type: string
            intents: ["*"]
            description: "Question naming a protocol, e.g. 'What is the TVL of Aave on Base?'"
          - name: protocol
            type: string
            intents: ["*"]
            description: "DefiLlama protocol slug or name. Supply protocol, pool_id or a query naming one."
          - name: chain
            type: string
            intents: ["*"]
            description: "Optional exact DefiLlama chain name, e.g. Base or Ethereum."
          - name: asset
            type: string
            intents: [CRYPTO_YIELD_RATE]
            description: "Optional asset symbol for yield pool selection, e.g. USDC."
          - name: pool_id
            type: string
            intents: ["*"]
            description: "Exact DefiLlama pool UUID. Takes precedence over protocol selection."

input_schema:
  type: object
  required: [intent]
  properties:
    intent:
      type: string
      enum: [TVL_LOOKUP, CRYPTO_YIELD_RATE]
    query:
      type: string
    protocol:
      type: string
    chain:
      type: string
    asset:
      type: string
    pool_id:
      type: string

output_schema:
  type: object
  required: [intent, signal, value, unit, scope, source_url, retrieved_at]
  properties:
    intent:
      type: string
    signal:
      type: string
    value:
      type: number
    unit:
      type: string
    scope:
      type: string
    source_url:
      type: string
    retrieved_at:
      type: string
    source_updated_at:
      type: ["string", "null"]
    maximum_cache_age_seconds:
      type: integer
    confidence:
      type: number
      minimum: 0
      maximum: 1

semantics:
  signal_mapping:
    label_field: signal
    confidence_field: confidence
  supported_intents: [TVL_LOOKUP, CRYPTO_YIELD_RATE]
